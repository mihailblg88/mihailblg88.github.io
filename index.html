<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikhail's Apps</title>
  <link rel="icon" href="remember/icon.svg">
  <link rel="stylesheet" href="remember/style.css">
  <style>
    .app { text-align: left; }
    .card { display: flex; gap: 16px; align-items: center; background: var(--card); border: 2px solid var(--border); border-radius: 18px; padding: 16px; margin-top: 24px; }
    .card img { width: 88px; height: 88px; border-radius: 20px; flex: none; }
    .card h2 { margin: 0 0 4px; color: var(--accent); font-size: 24px; }
    .card p { margin: 0 0 6px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="app">
    <h1>Apps</h1>
    <div class="card">
      <img src="remember/icon.svg" alt="">
      <div>
        <h2>I Want to Remember!</h2>
        <p>Tell it where you put things. Ask when you forget — it answers out loud.</p>
        <a href="remember/privacy.html">Privacy policy</a>
      </div>
    </div>
    <p class="muted" style="margin-top:24px">Contact: <a href="mailto:iwanttorememberapp@gmail.com">iwanttorememberapp@gmail.com</a></p>
  </main>
</body>
</html>
